# Atlas structure file, draft 1. Kept by atlas-lead.
# Declared, not inferred. Read from the playbooks on 2026-10-30 3:07 PM ET (19:07 UTC):
# ~/teams/CLAUDE.md, ~/teams/OPERATIONS.md, ~/teams/chief/CLAUDE.md, ~/teams/{atlas,orion}/CLAUDE.md,
# /data/herdr/team.md, ~/herdr-forecast/forecast-lead/CLAUDE.md, ~/herdr/*-agent/ playbooks.
# Goes into the repo verbatim; changes after that come by PR from atlas-lead.
# kind is one of: chief, team-lead, product-lead, engineering-lead, design-lead, reviewer, standing.

[teams.chief]
name = "Chief of staff"
workspace = ""
folders = ["~/teams/chief"]
items = "~/teams/chief/records/items"

[teams.devops]
name = "DevOps"
workspace = ""
folders = ["~/teams/devops"]
status = "~/teams/devops/STATUS.md"
decisions = "~/teams/devops/records/decisions.md"
reports = "~/teams/devops/records/reports"
items = "~/teams/devops/records/items"

[teams.atlas]
name = "Atlas"
workspace = "atlas"
folders = ["~/teams/atlas"]
status = "~/teams/atlas/lead/STATUS.md"
decisions = "~/teams/atlas/records/decisions.md"
repos = [
  { name = "atlas", base = "main", paths = ["~/teams/atlas/engineering-lead/atlas"] },
]
reports = "~/teams/atlas/records/reports"
items = "~/teams/atlas/records/items"

[teams.forge]
name = "Forge"
workspace = "forge"
folders = ["/data/herdr"]
status = "/data/herdr/forge-lead/STATUS.md"
decisions = "/data/herdr/forge-lead/DECISIONS.md"
repos = [
  { name = "orion-forge", base = "dev", paths = ["/data/repos/orion-forge", "/data/repos/orion-forge-runner", "/data/herdr/product-lead/forge-dev"] },
]
reports = "/data/reports"
items = "/data/items"

[teams.forecast]
name = "Forecast"
workspace = "forecast"
folders = ["~/herdr-forecast"]
status = "~/herdr-forecast/forecast-lead/STATUS.md"
decisions = "~/herdr-forecast/forecast-lead/DECISIONS.md"
repos = [
  { name = "orion-apps", base = "dev", paths = ["~/repos/orion-apps", "~/repos/orion-apps-wt-model-seam", "~/repos/orion-apps-wt-b1-trend", "~/repos/orion-apps-fc-product-docs", "~/repos/orion-apps-wt-sk-keys", "~/repos/orion-apps-wt-forge-studio"] },
  { name = "Orion-Forecast-Engine", base = "main", paths = ["~/repos/Orion-Forecast-Engine"] },
]
reports = "~/herdr-forecast/reports"
items = "~/herdr-forecast/items"

[teams.orion]
name = "Data team"
workspace = "data-team"
folders = ["~/teams/orion", "~/herdr"]
status = "~/teams/orion/lead/STATUS.md"
decisions = "~/teams/orion/records/decisions.md"
repos = [
  { name = "Orion-Finance", base = "main", paths = ["~/repos/Orion-Finance"] },
  { name = "Orion-Dimensions", base = "main", paths = ["~/repos/Orion-Dimensions"] },
  { name = "Orion-Deals", base = "dev", paths = ["~/repos/Orion-Deals"] },
  { name = "Astra-Accounts-Payable", base = "dev", paths = ["~/repos/Astra-Accounts-Payable"] },
  { name = "Astra-Accounts-Receivable", base = "dev", paths = ["~/repos/Astra-Accounts-Receivable"] },
  { name = "Astra-Operations", base = "dev", paths = ["~/repos/Astra-Operations"] },
  { name = "Astra-Pulse", base = "dev", paths = ["~/repos/Astra-Pulse"] },
  { name = "orion-observatory", base = "main", paths = ["~/repos/orion-observatory"] },
  { name = "orion-apps", base = "dev", paths = ["~/repos/orion-apps", "~/repos/orion-apps-wt-model-seam", "~/repos/orion-apps-wt-b1-trend", "~/repos/orion-apps-fc-product-docs", "~/repos/orion-apps-wt-sk-keys", "~/repos/orion-apps-wt-forge-studio"] },
]
reports = "~/vaults/Enterprise/reports"
items = "~/vaults/Enterprise/items"

[teams.dialtone]
name = "Dial Tone"
workspace = "dialtone"
folders = ["~/teams/dialtone"]
status = "~/teams/dialtone/lead/STATUS.md"
decisions = "~/teams/dialtone/records/decisions.md"
repos = [
  { name = "orion-apps", base = "dev", paths = ["~/repos/orion-apps"] },
